# pyproject.toml — tiny-wae (scaffoldé le 2026-08-21 avec le kit _tools_python)
# Environnement géré par PIXI (conda-forge + PyPI) — arbitrage : reco-stack-python.md du kit.
# ⭐ La section [project] reste du PEP 621 standard : c'est l'assurance de réversibilité
# pixi↔uv (le code et les métadonnées ne dépendent pas du gestionnaire choisi).

[project]
name = "tiny_wae"
version = "0.1.0"
description = "tiny-wae"
requires-python = ">=3.12"
# Dépendances RUNTIME au format standard — la liste doit être COMPLÈTE : c'est elle, et
# elle seule, que voit un `pip install` de la wheel hors de notre atelier (venv du worker
# PID-FLOW, cf. assets/cwl/README.md). Une dépendance omise ici n'empêche PAS
# l'installation, elle la fait échouer à l'IMPORT, au premier appel réel.
dependencies = [
    "typer>=0.15",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pystac-client>=0.8",
    # Natifs. Déclarés ici pour le paquet ET dans [tool.pixi.dependencies] ci-dessous pour
    # notre env de dev : pixi les prend alors de conda-forge (builds natifs cohérents),
    # tandis qu'un `pip install` hors pixi tire les wheels manylinux de PyPI — elles
    # embarquent GDAL (rasterio) et PROJ (pyproj), donc aucun conda requis côté worker.
    "numpy>=2.0",
    "rasterio>=1.4",
    # Importé DIRECTEMENT (core/geometry.py, adapters/chips.py) : jusqu'ici il n'arrivait
    # qu'en transitif de rasterio — une dépendance qu'on ne contrôle pas et qui peut
    # disparaître à une montée de version. Débusqué par tests/test_packaging.py.
    "affine>=2.4",
    "pyproj>=3.6",
    "pillow>=11.0",
]

# Point d'entrée console : `pip`/`pixi` génère un exécutable `tiny-wae` dans le `bin/` de
# l'environnement d'installation. C'est LUI que les `baseCommand` CWL appellent — pas
# `python -m tiny_wae`. Motif : `python` est le nom le plus surchargé du système et se
# résout silencieusement sur un interpréteur qui n'a pas le paquet ; `tiny-wae` est unique
# au projet et échoue franchement s'il est absent du PATH. Détail : assets/cwl/README.md.
[project.scripts]
tiny-wae = "tiny_wae.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiny_wae"]

# ── pixi ────────────────────────────────────────────────────────────────────────
# (`[tool.pixi.workspace]` : pixi récent ; sur un pixi plus ancien, renommer en
# `[tool.pixi.project]` — mêmes clés.)
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.pixi.dependencies]
# Paquets tirés de CONDA-FORGE (privilégier ici tout ce qui embarque du natif). Les trois
# natifs sont AUSSI dans [project.dependencies] : ici c'est le choix de la source pour
# notre env de dev, là-bas c'est le contrat du paquet livré. Les deux listes doivent rester
# cohérentes — garde-fou : tests/test_packaging.py.
python = "3.12.*"
pyproj = "*"
rasterio = "*"
pillow = "*"

[tool.pixi.pypi-dependencies]
# Le projet lui-même, éditable — expose les CLIs et le package.
"tiny_wae" = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
# Outillage dev (conda-forge) — invoqué UNIQUEMENT via le justfile.
ruff = "*"
mypy = "*"
pytest = "*"
markdown = "*"          # backlog-kit (dashboard + md2html)
pytest-socket = "*"     # garde réseau des tests (--disable-socket)

[tool.pixi.feature.dev.pypi-dependencies]
# cwltool : pas de build conda-forge compatible python 3.12 disponible — PyPI.
cwltool = "*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

# ── outillage ───────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Base pragmatique : erreurs + pyflakes + imports + bugbear + upgrade + comprehensions.
select = ["E", "F", "I", "B", "UP", "C4"]

[tool.mypy]
# Strict sur NOTRE code, pragmatique sur l'écosystème (libs géospatiales mal typées).
strict = true
files = ["src", "tests"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# ⚠ Portée réelle de la garde --disable-socket (décision E-b, fiche l0-02.2) : le chemin
# STAC UNIQUEMENT (httpx/pystac-client, qui passent par le module `socket` de Python).
# Elle NE COUVRE PAS les lectures rasterio/GDAL (C/libcurl, hors socket Python) — celles-ci
# sont gardées par le contrat TINY_WAE_OFFLINE dans adapters/chips.py (l0-03.3). Un seul
# dispositif ne suffit donc pas à garantir l'absence totale de réseau dans les tests.
addopts = "-q --disable-socket"
