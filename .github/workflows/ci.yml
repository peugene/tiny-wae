# CI — tiny-wae : le gate `just check`, à l'identique.
# Principe : la CI rejoue le harnais local, elle n'invente rien. Les recettes vivent dans
# le justfile ; ici on n'appelle QUE `just` (façade — cf. CLAUDE.md, règle façade).
#
# ⭐ UNE SEULE étape : `just check` (post-revue 1, constat A1). Énumérer ici les sous-étapes
# recréait une 2e définition de « fini », et les deux avaient divergé : la CI ne lançait ni
# `smoke` ni `cwl`, donc une PR pouvait être VERTE avec un smoke rouge ou un CWL invalide —
# les 4 `cwltool --validate` ne tournaient que chez qui pensait à lancer `just check`.
# Le smoke est déterministe et hors ligne (mode `--replay` par défaut, il pose lui-même
# TINY_WAE_OFFLINE=1 et lit le corpus de fixtures versionné) ; `cwltool` est dans l'env dev,
# donc installé par `just install`. Rien ne s'oppose plus à ce que la CI dise « fini ».
name: check

on:
  push:
  pull_request:

# Un push qui en remplace un autre annule le run devenu caduc (les runs s'empilaient).
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0
        with:
          cache: true
      - uses: extractions/setup-just@v4
      - run: just install
      - run: just check
